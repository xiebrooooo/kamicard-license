<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>卡密签发工具</title>
<style>
  :root{
    --bg:#1C1C1B; --card:#262625; --card2:#2E2E2C; --line:#3A3A38;
    --fg:#E8E6E1; --fg2:#A8A6A0; --fg3:#6E6C67;
    --accent:#4A9EFF; --ok:#4ADE80; --warn:#FBBF24; --err:#F87171;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg); font:13px/1.7 -apple-system,"Segoe UI",
    "Microsoft YaHei",sans-serif; padding:16px; height:100vh; overflow-y:auto;
  }
  h1{font-size:15px;font-weight:600;margin-bottom:4px}
  .sub{font-size:12px;color:var(--fg3);margin-bottom:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;
         padding:14px;margin-bottom:12px}
  .panel h2{font-size:12px;color:var(--fg2);font-weight:600;margin-bottom:10px;letter-spacing:.4px}

  label.f{display:block;margin-bottom:10px}
  label.f span{display:block;font-size:11px;color:var(--fg3);margin-bottom:4px}
  input[type=text],input[type=number]{
    width:100%;background:#1A1A19;border:1px solid var(--line);border-radius:6px;
    color:var(--fg);padding:8px 10px;font:13px Consolas,monospace;
  }
  input:focus{outline:none;border-color:var(--accent)}
  input::placeholder{color:var(--fg3);font-family:inherit}

  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .quick button{
    background:var(--card2);border:1px solid var(--line);color:var(--fg);
    border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;
  }
  .quick button:hover{background:#383836}
  .quick button.on{background:var(--accent);border-color:var(--accent);
                   color:#04121F;font-weight:600}

  button.primary{
    background:var(--accent);border:1px solid var(--accent);color:#04121F;
    border-radius:8px;padding:9px 22px;font-size:13px;font-weight:600;cursor:pointer;
  }
  button.primary:hover{background:#63ACFF}
  button:disabled{opacity:.35;cursor:not-allowed}

  .result{
    margin-top:12px;padding:12px;border-radius:8px;border:1px solid var(--line);
    background:#1A1A19;display:none;
  }
  .result.show{display:block}
  .result.err{border-color:#5A3030;color:#FFB4B4}
  .result.ok{border-color:#2A4A2A}
  .card-code{
    font:15px Consolas,monospace;letter-spacing:1px;color:var(--fg);
    word-break:break-all;margin:6px 0 10px;user-select:all;
  }
  .meta{font-size:12px;color:var(--fg2)}
  .copy-btn{
    background:var(--card2);border:1px solid var(--line);color:var(--fg);
    border-radius:6px;padding:5px 14px;font-size:12px;cursor:pointer;margin-right:8px;
  }
  .copy-btn:hover{background:#383836}

  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{color:var(--fg3);font-weight:400;text-align:left;padding:4px 6px;
     border-bottom:1px solid var(--line)}
  td{padding:4px 6px;border-bottom:1px solid #2F2F2D;color:var(--fg2);
     font-family:Consolas,monospace}
  .hint{font-size:11.5px;color:var(--fg3);line-height:1.8;margin-top:10px}
  .hint b{color:var(--warn)}
</style>
</head>
<body>

<h1>卡密签发工具</h1>
<div class="sub">把用户发来的机器指纹粘贴进去，选好天数，生成只在那台电脑上能用的卡密</div>

<div class="panel">
  <h2>签发</h2>
  <label class="f"><span>用户的机器指纹（16 位，用户从软件激活窗里复制给你的）</span>
    <input type="text" id="machine" placeholder="例如 89b6a98b26c5628f" maxlength="16">
  </label>

  <label class="f"><span>有效时长（可按小时签发）</span>
    <div class="quick">
      <button data-h="1">1 小时</button>
      <button data-h="24">24 小时</button>
      <button data-h="72">3 天</button>
      <button data-h="168">7 天</button>
      <button data-h="720" class="on">30 天</button>
      <button data-h="8760">一年</button>
      <button data-h="0">自定义</button>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <input type="number" id="hours" value="720" min="1" max="87600"
             style="display:none;width:140px">
      <span id="hours-unit" style="font-size:12px;color:var(--fg3);display:none">小时</span>
    </div>
  </label>

  <label class="f"><span>备注（可选，比如记下是谁买的，只存在你本机）</span>
    <input type="text" id="note" placeholder="例如：微信昵称 xxx，2026-10-03 付款"
           style="font-family:inherit">
  </label>

  <button class="primary" id="b-gen">生成卡密</button>

  <div class="result" id="result">
    <div id="result-text"></div>
    <div class="card-code" id="card-code"></div>
    <div class="meta" id="result-meta"></div>
    <div style="margin-top:10px">
      <button class="copy-btn" id="b-copy">复制卡密</button>
      <span id="copy-tip" style="font-size:12px;color:var(--ok)"></span>
    </div>
  </div>
</div>

<div class="panel">
  <h2>查卡（粘贴一张卡密看详情）</h2>
  <div style="display:flex;gap:8px">
    <input type="text" id="check-card" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX"
           style="flex:1">
    <button class="copy-btn" id="b-check">查询</button>
  </div>
  <div class="meta" id="check-result" style="margin-top:8px"></div>
</div>

<div class="panel">
  <h2>签发记录（存在本机 cards\history.json）</h2>
  <div style="max-height:180px;overflow-y:auto">
    <table>
      <thead><tr><th>时间</th><th>卡密</th><th>时长</th><th>到期</th><th>备注</th></tr></thead>
      <tbody id="hist-body"><tr><td colspan="5" style="color:var(--fg3)">还没有签发记录</td></tr></tbody>
    </table>
  </div>
</div>

<div class="hint">
  <b>安全提醒</b>：这个工具里含有卡密密钥，只装在你自己的电脑上，<b>绝对不要发给任何用户</b>，
  也不要拷进发给用户的软件文件夹里。
</div>

<script>
const $ = id => document.getElementById(id);
let pickedHours = 720;

async function call(fn, ...args){
  try { return await window.pywebview.api[fn](...args); }
  catch(e){ return {ok:false, msg:String(e)}; }
}

// ---- 快捷时长（单位：小时）----
document.querySelectorAll('.quick button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.quick button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    const h = +b.dataset.h;
    if (h > 0) {
      pickedHours = h;
      $('hours').style.display = 'none';
      $('hours-unit').style.display = 'none';
    } else {
      $('hours').style.display = '';
      $('hours-unit').style.display = '';
      $('hours').focus();
    }
  };
});

// ---- 生成 ----
$('b-gen').onclick = async () => {
  const hours = pickedHours > 0 ? pickedHours : (parseInt($('hours').value) || 0);
  const r = await call('gen', $('machine').value, hours, $('note').value);
  const box = $('result');
  box.classList.add('show');
  box.classList.remove('err', 'ok');
  if (r.ok) {
    box.classList.add('ok');
    $('result-text').innerHTML = '<span style="color:var(--ok)">生成成功</span>';
    $('card-code').textContent = r.card;
    $('result-meta').textContent =
      `时长 ${r.remaining_text}，至 ${r.expires}，仅限指纹 ${r.machine} 的电脑使用`;
    $('copy-tip').textContent = '';
    loadHistory();
  } else {
    box.classList.add('err');
    $('result-text').textContent = r.msg || '生成失败';
    $('card-code').textContent = '';
    $('result-meta').textContent = '';
  }
};

// ---- 复制 ----
$('b-copy').onclick = async () => {
  const t = $('card-code').textContent;
  if (!t) return;
  try {
    await navigator.clipboard.writeText(t);
    $('copy-tip').textContent = '已复制 ✓';
  } catch(e) {
    // 兜底：老环境没有 clipboard API
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
    $('copy-tip').textContent = '已复制 ✓';
  }
  setTimeout(() => $('copy-tip').textContent = '', 2000);
};

// ---- 查卡 ----
$('b-check').onclick = async () => {
  const r = await call('check', $('check-card').value);
  $('check-result').innerHTML = r.ok
    ? `<span style="color:var(--ok)">有效</span> · 到期 ${r.expires} · 剩余 ${r.days_left} 天 · 指纹 ${r.machine_fp}`
    : `<span style="color:var(--err)">${r.msg}</span>`;
};
$('check-card').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('b-check').click();
});

// ---- 历史 ----
async function loadHistory(){
  const r = await call('history');
  const body = $('hist-body');
  if (!r.items || !r.items.length) return;
  body.innerHTML = r.items.slice().reverse().map(h =>
    `<tr><td>${h.time}</td><td>${h.card}</td><td>${(h.hours != null ? h.hours + ' 小时' : (h.days + ' 天'))}</td>
     <td>${h.expires}</td><td>${(h.note||'').replace(/</g,'&lt;')}</td></tr>`
  ).join('');
}

(async () => {
  for (let i = 0; i < 40 && !window.pywebview?.api; i++) {
    await new Promise(r => setTimeout(r, 100));
  }
  loadHistory();
  $('machine').focus();
})();
</script>
</body>
</html>
